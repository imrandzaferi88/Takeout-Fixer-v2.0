name: Build APK da ZIP

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Estrai lo ZIP del progetto
        run: |
          # Mostra i file presenti per verifica
          echo "File presenti nel repository:"
          ls -la
          
          # Trova qualsiasi file zip presente, anche nelle sottocartelle
          ZIP_PATH=$(find . -name "*.zip" | head -n 1)
          
          if [ -z "$ZIP_PATH" ]; then
            echo "ERRORE: Nessun file .zip trovato nel repository!"
            exit 1
          fi
          
          echo "Archivio trovato: $ZIP_PATH"
          unzip -o "$ZIP_PATH"
          
          # Se lo zip ha una cartella interna, sposta i file nella root
          if [ -d "TakeoutFixerAndroid" ]; then
            cp -r TakeoutFixerAndroid/* .
          fi

      - name: Configura Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configura Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Compila APK
        run: gradle assembleDebug --stacktrace

      - name: Carica APK pronto
        uses: actions/upload-artifact@v4
        with:
          name: TakeoutFixer-APK
          path: app/build/outputs/apk/debug/app-debug.apk
